# headscale 配置（M8 控制面，v0.29.4）
# 基于 v0.29.4 官方 config-example.yaml 裁剪；占位符 __VPS_IP__ 由上传命令用真实 IP 替换。
# 本文件会随仓库公开 —— 真实 IP 只在执行 sed 替换的那一刻存在于命令与远端文件中，不落本地。

server_url: https://__VPS_IP__:8443
listen_addr: 0.0.0.0:8443
metrics_listen_addr: 127.0.0.1:9090
grpc_listen_addr: 127.0.0.1:50443
grpc_allow_insecure: false
trusted_proxies: []

noise:
  private_key_path: /var/lib/headscale/noise_private.key

# tailnet 地址段（Tailscale 规定的 CGNAT 段，不动）
prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

derp:
  server:
    enabled: true
    region_id: 999
    region_code: dsh-tailnet
    region_name: dsh-mobile DERP
    verify_clients: true
    stun_listen_addr: 0.0.0.0:3478
    private_key_path: /var/lib/headscale/derp_server_private.key
    automatically_add_embedded_derp_region: true
    ipv4: __VPS_IP__
  urls: []                    # 只用自建 DERP，不加载 Tailscale 官方 DERP map
  paths: []
  auto_update_enabled: false
  update_frequency: 3h

disable_check_updates: true

node:
  expiry: 0
  ephemeral:
    inactivity_timeout: 30m

database:
  type: sqlite
  debug: false
  gorm:
    prepare_stmt: true
    parameterized_queries: true
    skip_err_record_not_found: true
    slow_threshold: 1000
  sqlite:
    path: /var/lib/headscale/db.sqlite
    write_ahead_log: true
    wal_autocheckpoint: 1000

# TLS：自签 CA 签的叶子证书（gen-certs.sh 产物，见 HEADSCALE.md §2）
tls_cert_path: /etc/headscale/tls/server.crt
tls_key_path: /etc/headscale/tls/server.key

log:
  level: info
  format: text

policy:
  mode: file
  path: ""

# DNS：M8 决定 8 —— 不用 MagicDNS，直用 100.x IP；不接管客户端 DNS
dns:
  magic_dns: false
  base_domain: example.com
  override_local_dns: false
  nameservers:
    global:
      - 1.1.1.1
      - 1.0.0.1
    split: {}
  search_domains: []
  extra_records: []

unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: "0770"
