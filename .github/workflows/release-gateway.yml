name: Release gateway

# 版本号只有 tag 一个来源，且**一个 tag 就是这一套东西的版本** —— iOS 与网关用同一个数，
# 不再分两个前缀：iOS 没有可分发的产物，单独给网关一套版本号只会多一件事要同步。
# 触发条件因此是推任意 `v*` tag，推分支只跑 CI。
# `workflow_dispatch` 留着补发：同一个 tag 重跑时下面的步骤是幂等的。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 要重发的 tag（须是已存在的 gateway-v* 标签）
        required: true

# 建 release 与上传附件要写权限。CI 那个 workflow 是只读的，两者互不影响。
permissions:
  contents: write

# 同一个 tag 不并发：半途取消会留下一个没有附件的 release，那比没发更糟。
concurrency:
  group: release-gateway-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # 实测网关测试 15 秒上下；上限用来把「挂住」变成明确失败。
    timeout-minutes: 15
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: 取代码
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gateway/package-lock.json

      - name: 装依赖
        working-directory: gateway
        run: npm ci

      # 版本号只允许有一个来源：tag。两处不一致时发出去的包版本是错的，而这个错误只在
      # 别人安装时才显形 —— 那时已经晚了。
      # 顺序因此是「先改 package.json 再打 tag」。`scripts/release.sh` 也会写这一格，但它
      # 写在归档之后；按这个顺序，那一步只会输出「已是」，不会产生未提交的改动。
      - name: 校验 tag 与 package.json 一致
        working-directory: gateway
        run: |
          version="$(node -p "require('./package.json').version")"
          tag_version="${TAG#v}"
          if [ "$tag_version" != "$version" ]; then
            echo "::error::tag 是 ${TAG}，package.json 是 ${version}；先把 version 改成 ${tag_version} 再打 tag"
            exit 1
          fi

      # tag 可以指向任何 commit，包括没跑过 CI 的 —— 所以这里再跑一遍。
      # 判据条数下限不重复设：那是 CI 随时间守「扫描面没缩水」的事，不是这一次的判断。
      - name: 测试
        working-directory: gateway
        run: npm test

      - name: 打包
        working-directory: gateway
        run: npm pack

      # 幂等：重跑同一个 tag 时 release 已经存在，只更新附件。
      - name: 建 release 并上传附件
        working-directory: gateway
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 由 env 注入而不是在脚本里写 `${{ }}`：那样 shell 会把它当成参数展开，
          # 而这条脚本要能在本地直接跑一遍验证。
          REPO: ${{ github.repository }}
        run: |
          version="$(node -p "require('./package.json').version")"
          # 附件名不带版本：`latest/download/` 那个地址要永远指向最新那份，而 install.sh
          # 里写的正是这个名字。具体版本由 URL 的 tag 段表达，不需要再进文件名。
          asset="dsh-mobile-gateway.tgz"
          cp "dsh-mobile-gateway-$version.tgz" "$asset"
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "dsh-mobile-gateway $version"
            echo
            echo "安装（在仓库根目录执行）："
            echo
            echo '```'
            echo "./install.sh --from-release"
            echo '```'
            echo "或让 dsh 直接装这个附件："
            echo
            echo '```'
            echo "dsh plugin --profile web add https://github.com/${REPO}/releases/download/${TAG}/${asset}"
            echo '```'
          } > "$notes"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes-file "$notes"
          gh release upload "$TAG" "$asset" --clobber
